spring.application.name=funeraleslaluz.com
server.port=${PORT:3587}

# ==========================================
# 1. BASE DE DATOS (Conexión segura)
# ==========================================
# Usa variables de entorno en producción. Si no existen, usa tu configuración por defecto de local.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:funeraleslaluz}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=${DB_USER:root}
#spring.datasource.password=${DB_PASS:}
spring.datasource.username=app_spring_user
spring.datasource.password=K9#mX2!vP9$zQ4&wL1*bN
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Seguro para Producción
# En local/desarrollo mantén "update", pero en producción ponlo en "none" o "validate"
spring.jpa.hibernate.ddl-auto=${JPA_DDL_MODE:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ==========================================
# 2. SUBIDA DE ARCHIVOS (Imágenes y Banners)
# ==========================================
# Ajustamos los límites de tamaño para que soporte imágenes pesadas de banners
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ruta de subida absoluta externa (Evita que las imágenes se borren al reiniciar o redesplegar el JAR)
# En local usará "uploads/", pero en producción puedes definir una ruta como "/var/www/funerales/uploads"
upload.dir=${UPLOAD_PATH:uploads/}

# ==========================================
# 3. SEGURIDAD DE SESIONES (HTTPS)
# ==========================================
# Activa esto solo cuando ya tengas certificado SSL (HTTPS) en tu dominio de producción
# server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# ==========================================
# 4. CONFIGURACIÓN DE CORREO (SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Se recomienda usar variables de entorno para proteger tu contraseña de Gmail de 16 letras
#spring.mail.username=${MAIL_USER:santicontreras400@gmail.com}
#spring.mail.password=${MAIL_PASS:gejt ubey ivqb vnod}
spring.mail.username=${MAIL_USER:laluzasistenciaintegral@gmail.com}
spring.mail.password=${MAIL_PASS:zwtxyhzaxuwwbund}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 5. RENDIMIENTO (Optimización de Caché)
# ==========================================
# En local la caché está apagada, pero en producción se activa para mejorar la velocidad
spring.thymeleaf.cache=${TEMPLATE_CACHE:false}
spring.web.resources.chain.cache=${RESOURCE_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


