spring.application.name=funeraleslaluz.com
# Ajustado a 8080 para que coincida con el puerto interno que Docker espera
server.port=${PORT:8080}

# ==========================================
# 1. BASE DE DATOS (Conexión segura)
# ==========================================
# Cambiado por defecto a 'mysql-db' (nombre del contenedor) y 'db_funeraria_prod'
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql-db}:${DB_PORT:3306}/${DB_NAME:db_funeraria_prod}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=app_spring_user
spring.datasource.password=K9#mX2!vP9$zQ4&wL1*bN
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Seguro para Producción
spring.jpa.hibernate.ddl-auto=${JPA_DDL_MODE:update}
# Actualizado al dialecto moderno para MySQL 8
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# ==========================================
# 2. SUBIDA DE ARCHIVOS (Imágenes y Banners)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# En Docker usaremos una ruta interna fija, luego la mapearemos en el compose si es necesario
upload.dir=${UPLOAD_PATH:/app/uploads/}

# ==========================================
# 3. SEGURIDAD DE SESIONES (HTTPS)
# ==========================================
server.servlet.session.cookie.http-only=true

# ==========================================
# 4. CONFIGURACIÓN DE CORREO (SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:laluzasistenciaintegral@gmail.com}
spring.mail.password=${MAIL_PASS:zwtxyhzaxuwwbund}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 5. RENDIMIENTO (Optimización de Caché)
# ==========================================
spring.thymeleaf.cache=${TEMPLATE_CACHE:false}
spring.web.resources.chain.cache=${RESOURCE_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html