spring.application.name=funeraleslaluz.com
# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/funeraleslaluz?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# Show SQL queries executed against the database
spring.jpa.show-sql=true

# Enable Thymeleaf (default: true)
#spring.thymeleaf.enabled=true

# Template location
spring.thymeleaf.prefix=classpath:/templates/

# File suffix
spring.thymeleaf.suffix=.html

upload.dir=src/main/resources/static/uploads


# Configuración del servidor SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
