<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Empleados | La Luz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/Luz.png}">

    <style>
        :root {
            --bg-gradient-start: #f8fafc;
            --bg-gradient-end: #e2e8f0;
            --card-bg: #ffffff;
            --primary-color: #1e293b;
            --accent-gold: #b45309; /* Un tono sobrio corporativo */
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-focus: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            position: relative; /* Necesario para ubicar el botón de volver en la esquina */
        }

        /* Estilo del Botón Regresar */
        .btn-back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid transparent;
        }

        .btn-back-home:hover {
            color: var(--primary-color);
            background-color: #f1f5f9;
            border-color: var(--border-color);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
            margin-top: 15px; /* Pequeño espacio para que no choque con el botón de regresar */
        }

        .brand-logo {
            font-size: 28px;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-logo i {
            color: var(--accent-gold);
            margin-right: 6px;
            font-size: 24px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Alertas de error/éxito para Spring Security */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-danger {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .field-label i {
            margin-right: 4px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--primary-color);
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--input-focus);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-login:hover {
            background-color: #0f172a;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <a th:href="@{/}" class="btn-back-home">
            <i class="bi bi-arrow-left"></i> Volver al sitio
        </a>

        <div class="brand-header">
            <div style="width: 70px; height: 70px; margin: 0 auto 12px auto;">
                <img th:src="@{/img/Luz.png}" alt="Logo La Luz"
                     style="width: 100%; height: 100%; object-fit: contain;">
            </div>

            <h1 class="brand-logo" style="margin-top: 0;">La Luz</h1>
            <p class="brand-subtitle">Asistencia Integral • Panel Operativo</p>
        </div>

        <div class="alert alert-danger" th:if="${param.error}">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span>Usuario o contraseña incorrectos. Inténtelo de nuevo de forma segura.</span>
        </div>

        <div class="alert alert-success" th:if="${param.logout}" style="background-color: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;">
            <i class="bi bi-check-circle-fill"></i>
            <span>Sesión finalizada correctamente. Las cookies de sesión han sido destruidas.</span>
        </div>

        <form th:action="@{/obituarios/usuarios/login}" method="POST">

            <div class="field-group">
                <label for="username" class="field-label">
                    <i class="bi bi-person-badge"></i> Correo Electrónico
                </label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" class="form-input" placeholder="Ej: cmendoza@funeraleslaluz.com" required autofocus>
                </div>
            </div>

            <div class="field-group">
                <label for="password" class="field-label">
                    <i class="bi bi-key"></i> Contraseña de Acceso
                </label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Ingresar al Sistema Segurizado <i class="bi bi-arrow-right-short"></i>
            </button>

        </form>


        <div class="login-footer">
            &copy; 2026 Funerales la Luz. Todos los derechos reservados.
        </div>
    </div>
</div>

</body>
</html>
